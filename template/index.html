      function t(lang, key, params = {}) {
        const langObj = I18N[lang] || I18N.en;
        let str = langObj[key] !== undefined ? langObj[key] : (I18N.en[key] || key);
        if (params && typeof params === 'object') {
          Object.keys(params).forEach(k => {
            str = str.replace(new RegExp(`\\{${k}\\}`, 'g'), params[k]);
          });
        }
        return str;
      }

      function getCurrencySymbol(code) {
        if (!code) return '₦';
        const map = {
          'NGN': '₦', 'USD': '$', 'EUR': '€', 'GBP': '£',
          'KES': 'KSh ', 'GHS': 'GH₵ ', 'ZAR': 'R ', 'CAD': '$', 'AUD': '$'
        };
        return map[code.toUpperCase()] || (code + ' ');
      }

      function formatPrice(amount, currency) {
        if (amount === null || amount === undefined || isNaN(amount)) {
          return null;
        }
        const sym = getCurrencySymbol(currency);
        return sym + Number(amount).toLocaleString();
      }

      function cleanPhone(phone) {
        if (!phone) return '';
        return String(phone).replace(/[^0-9]/g, '');
      }

      function buildWhatsAppUrl(phone, text) {
        const clean = cleanPhone(phone);
        const encoded = encodeURIComponent(text);
        if (!clean) {
          return `https://wa.me/?text=${encoded}`;
        }
        return `https://wa.me/${clean}?text=${encoded}`;
      }

      function renderStore(data) {
        if (!data) return;

        let currentLang = data.language || 'en';

        // Apply theme and layout class
        const themeClass = data.theme ? 'theme-' + data.theme : 'theme-emerald';
        const layoutClass = data.layout === 'compact' ? ' layout-compact' : '';
        document.body.className = `${themeClass}${layoutClass}`;

        const vendorName = data.vendor_name || 'Vendor Catalog';
        const vendorPhone = data.vendor_phone || '';
        const defaultCurrency = data.currency_default || 'NGN';
        const tagline = data.tagline || t(currentLang, 'tagline_fallback');
        const products = Array.isArray(data.products) ? data.products : [];

        // Update Page Titles and Header
        document.title = `${vendorName} - Storefront`;
        const titleMeta = document.getElementById('page-meta-desc');
        if (titleMeta) titleMeta.content = `Browse products from ${vendorName} and order directly on WhatsApp.`;

        const nameEl = document.getElementById('store-name-text');
        if (nameEl) nameEl.textContent = vendorName;

        const taglineEl = document.getElementById('store-tagline-text');
        if (taglineEl) taglineEl.textContent = tagline;

        const avatarEl = document.getElementById('vendor-avatar');
        if (avatarEl) avatarEl.textContent = vendorName.trim().charAt(0).toUpperCase() || 'S';

        // Wire up Live Theme, Layout & Language Customizers
        const themeSelect = document.getElementById('live-theme-select');
        const layoutSelect = document.getElementById('live-layout-select');
        const langSelect = document.getElementById('live-lang-select');

        if (themeSelect) {
          themeSelect.value = data.theme || 'emerald';
          themeSelect.onchange = function() {
            data.theme = themeSelect.value;
            const lay = layoutSelect ? layoutSelect.value : (data.layout || 'standard');
            document.body.className = `theme-${data.theme}${lay === 'compact' ? ' layout-compact' : ''}`;
          };
        }

        if (layoutSelect) {
          layoutSelect.value = data.layout || 'standard';
          layoutSelect.onchange = function() {
            data.layout = layoutSelect.value;
            const th = themeSelect ? themeSelect.value : (data.theme || 'emerald');
            document.body.className = `theme-${th}${data.layout === 'compact' ? ' layout-compact' : ''}`;
          };
        }

        if (langSelect) {
          langSelect.value = currentLang;
          langSelect.onchange = function() {
            currentLang = langSelect.value;
            data.language = currentLang;
            applyLanguage();
          };
        }

        // PDF Catalog & Share Buttons
        const pdfBtn = document.getElementById('btn-live-pdf');
        if (pdfBtn) {
          pdfBtn.onclick = function() {
            window.print();
          };
        }

        const shareBtn = document.getElementById('btn-live-share');
        if (shareBtn) {
          shareBtn.onclick = async function() {
            const shareTitle = `${vendorName} - Product Catalog`;
            const shareText = `🛍️ *${vendorName} - Product Catalog*\n${tagline}\n\nBrowse ${products.length} verified products and order directly on WhatsApp!\nPhone: ${vendorPhone || 'Direct Chat'}`;
            const shareUrl = window.location.href;

            if (navigator.share) {
              try {
                await navigator.share({
                  title: shareTitle,
                  text: shareText,
                  url: shareUrl
                });
                return;
              } catch (err) {}
            }

            // Fallback: Copy link and open WhatsApp
            if (navigator.clipboard && navigator.clipboard.writeText) {
              try { await navigator.clipboard.writeText(shareUrl); } catch(_) {}
            }
            const waUrl = `https://wa.me/?text=${encodeURIComponent(shareText + '\n' + shareUrl)}`;
            window.open(waUrl, '_blank');
          };
        }

        // Category Filter Pills State
        const catBar = document.getElementById('category-filter-bar');
        let selectedCategory = 'all';
        let filterInStockOnly = false;
        const grid = document.getElementById('product-grid');
        const emptyState = document.getElementById('empty-state');

        function applyLanguage() {
          const dict = I18N[currentLang] || I18N.en;
          const isRTL = dict.dir === 'rtl';

          document.documentElement.setAttribute('dir', dict.dir);
          document.documentElement.setAttribute('lang', dict.code);
          document.body.setAttribute('dir', dict.dir);

          // Update header & toolbar labels
          const headerContactText = document.getElementById('header-contact-text');
          if (headerContactText) headerContactText.textContent = t(currentLang, 'message_store');

          const generalHello = t(currentLang, 'chat_general', { vendor_name: vendorName });
          const generalWaUrl = buildWhatsAppUrl(vendorPhone, generalHello);

          const headerLink = document.getElementById('header-contact-link');
          if (headerLink) headerLink.href = generalWaUrl;

          const stickyBtn = document.getElementById('sticky-wa-btn');
          if (stickyBtn) stickyBtn.href = generalWaUrl;

          const stickyWaText = document.getElementById('sticky-wa-text');
          if (stickyWaText) stickyWaText.textContent = t(currentLang, 'sticky_chat');

          const themeLabel = document.getElementById('live-theme-label-span');
          if (themeLabel) themeLabel.textContent = t(currentLang, 'style_label');

          const layoutLabel = document.getElementById('live-layout-label-span');
          if (layoutLabel) layoutLabel.textContent = t(currentLang, 'grid_label');

          const langLabel = document.getElementById('live-lang-label-span');
          if (langLabel) langLabel.textContent = t(currentLang, 'lang_label');

          const optStandard = document.getElementById('opt-layout-standard');
          if (optStandard) optStandard.textContent = t(currentLang, 'grid_standard');

          const optCompact = document.getElementById('opt-layout-compact');
          if (optCompact) optCompact.textContent = t(currentLang, 'grid_compact');

          const pdfBtnText = document.getElementById('btn-live-pdf-text');
          if (pdfBtnText) pdfBtnText.textContent = t(currentLang, 'pdf_catalog');

          const shareBtnText = document.getElementById('btn-live-share-text');
          if (shareBtnText) shareBtnText.textContent = t(currentLang, 'share');

          const catalogLabelText = document.getElementById('catalog-label-text');
          if (catalogLabelText) catalogLabelText.textContent = t(currentLang, 'catalog_label');

          const countUnit = products.length === 1 ? t(currentLang, 'item_singular') : t(currentLang, 'item_plural');
          const countEl = document.getElementById('product-count');
          if (countEl) countEl.textContent = `${products.length} ${countUnit}`;

          const currencyLabel = document.getElementById('catalog-currency-label');
          if (currencyLabel) currencyLabel.textContent = t(currentLang, 'direct_checkout');

          const emptyTitle = document.getElementById('empty-title-text');
          if (emptyTitle) emptyTitle.textContent = t(currentLang, 'empty_title');

          const emptyDesc = document.getElementById('empty-desc-text');
          if (emptyDesc) emptyDesc.textContent = t(currentLang, 'empty_desc');

          const footerText = document.getElementById('store-footer-text');
          if (footerText) footerText.textContent = t(currentLang, 'powered_by');

          // Re-render Category Pills
          renderCategoryPills();

          // Re-render Product Grid with translated labels & WhatsApp prefilled messages
          renderProductsGrid();
        }

        function renderCategoryPills() {
          if (!catBar) return;
          const categories = ['all'];
          products.forEach(p => {
            if (p.category && !categories.includes(p.category)) {
              categories.push(p.category);
            }
          });

          if (categories.length > 2) {
            catBar.style.display = 'flex';
            catBar.innerHTML = '';
            categories.forEach(cat => {
              const pill = document.createElement('button');
              pill.className = `cat-pill ${cat === selectedCategory ? 'active' : ''}`;
              pill.textContent = cat === 'all' ? t(currentLang, 'all_products') : cat;
              pill.onclick = function() {
                selectedCategory = cat;
                catBar.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
                pill.classList.add('active');
                renderProductsGrid();
              };
              catBar.appendChild(pill);
            });

            // Stock Filter Pill
            const hasSoldOutItems = products.some(p => p.in_stock === false || p.stock_status === 'sold_out');
            if (hasSoldOutItems) {
              const stockPill = document.createElement('button');
              stockPill.className = `cat-pill ${filterInStockOnly ? 'active' : ''}`;
              stockPill.id = 'pill-filter-instock';
              stockPill.textContent = t(currentLang, 'in_stock_only');
              stockPill.onclick = function() {
                filterInStockOnly = !filterInStockOnly;
                stockPill.classList.toggle('active', filterInStockOnly);
                renderProductsGrid();
              };
              catBar.appendChild(stockPill);
            }
          } else {
            catBar.style.display = 'none';
          }
        }

        function renderProductsGrid() {
          let displayed = selectedCategory === 'all' 
            ? products 
            : products.filter(p => p.category === selectedCategory);

          if (filterInStockOnly) {
            displayed = displayed.filter(p => p.in_stock !== false && p.stock_status !== 'sold_out');
          }

          if (!displayed.length) {
            if (grid) grid.innerHTML = '';
            if (emptyState) emptyState.style.display = 'block';
            return;
          }

          if (emptyState) emptyState.style.display = 'none';
          if (!grid) return;

          grid.innerHTML = '';

          displayed.forEach(function(product, pIndex) {
            const card = document.createElement('article');
            const isSoldOut = product.in_stock === false || product.stock_status === 'sold_out';
            card.className = `product-card ${isSoldOut ? 'is-sold-out' : ''}`;
            card.setAttribute('role', 'listitem');

            const hasPrice = product.price && product.price.amount !== null && !isNaN(product.price.amount);
            const currency = (product.price && product.price.currency) || defaultCurrency;
            const formattedPrice = hasPrice ? formatPrice(product.price.amount, currency) : null;

            // Build tailored WhatsApp message using active language
            let orderMessage = '';
            if (isSoldOut) {
              orderMessage = t(currentLang, 'chat_restock', { vendor_name: vendorName, product_name: product.name });
            } else if (hasPrice) {
              if (currentLang === 'en' && data.message_template) {
                orderMessage = data.message_template
                  .replace(/{vendor_name}/g, vendorName)
                  .replace(/{product_name}/g, product.name)
                  .replace(/{product_price}/g, formattedPrice);
              } else {
                orderMessage = t(currentLang, 'chat_order', {
                  vendor_name: vendorName,
                  product_name: product.name,
                  product_price: formattedPrice
                });
              }
            } else {
              orderMessage = t(currentLang, 'chat_ask', { vendor_name: vendorName, product_name: product.name });
            }

            const orderUrl = buildWhatsAppUrl(vendorPhone, orderMessage);

            // Images & Multi-Image Carousel
            const prodImages = Array.isArray(product.images) && product.images.length > 0
              ? product.images
              : (product.image ? [product.image] : (product.id ? [`images/${product.id}.jpg`] : []));

            let imageHtml = '';
            if (prodImages.length > 1) {
              const slidesHtml = prodImages.map((src, idx) => `
                <div class="carousel-slide ${idx === 0 ? 'active' : ''}" data-slide="${idx}">
                  <img src="${src}" alt="${escapeHtml(product.name)} - Photo ${idx + 1}" class="product-image" loading="${idx === 0 ? 'eager' : 'lazy'}" decoding="async" />
                </div>
              `).join('');

              const dotsHtml = prodImages.map((_, idx) => `
                <button type="button" class="carousel-dot ${idx === 0 ? 'active' : ''}" data-index="${idx}" aria-label="Slide ${idx + 1}"></button>
              `).join('');

              imageHtml = `
                <div class="product-carousel" id="carousel-${product.id || pIndex}">
                  ${slidesHtml}
                  <button type="button" class="carousel-nav-btn prev" aria-label="Previous photo">❮</button>
                  <button type="button" class="carousel-nav-btn next" aria-label="Next photo">❯</button>
                  <div class="carousel-dots">${dotsHtml}</div>
                </div>
              `;
            } else if (prodImages.length === 1) {
              const noPhotoText = t(currentLang, 'no_photo');
              imageHtml = `
                <img src="${prodImages[0]}" 
                     alt="${escapeHtml(product.name)}" 
                     class="product-image" 
                     loading="lazy" 
                     decoding="async"
                     onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'image-fallback\\'><span>${noPhotoText}</span></div>';" />
              `;
            } else {
              imageHtml = `
                <div class="image-fallback">
                  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                  </svg>
                  <span>${t(currentLang, 'no_photo')}</span>
                </div>
              `;
            }

            const categoryBadge = product.category ? `<span class="product-category-tag">${escapeHtml(product.category)}</span>` : '';
            const soldOutBadge = isSoldOut ? `<span class="badge-sold-out">${t(currentLang, 'sold_out')}</span>` : '';

            const priceHtml = hasPrice ? `
              <span class="product-price">${formattedPrice}</span>
            ` : `
              <span class="price-ask">${t(currentLang, 'ask_for_price')}</span>
            `;

            let buttonClass = 'btn-order-wa';
            let buttonLabel = t(currentLang, 'order_button');

            if (isSoldOut) {
              buttonClass = 'btn-order-wa btn-sold-out';
              buttonLabel = t(currentLang, 'sold_out_button');
            } else if (!hasPrice) {
              buttonClass = 'btn-order-wa btn-ask-wa';
              buttonLabel = t(currentLang, 'ask_button');
            } else if (currentLang === 'en' && data.order_button_text) {
              buttonLabel = data.order_button_text;
            }

            card.innerHTML = `
              <div class="product-image-wrap">
                ${categoryBadge}
                ${soldOutBadge}
                ${imageHtml}
              </div>
              <div class="product-body">
                <h2 class="product-title">${escapeHtml(product.name)}</h2>
                <p class="product-desc">${escapeHtml(product.description || '')}</p>
                <div class="product-price-row">
                  ${priceHtml}
                </div>
                <a href="${orderUrl}" target="_blank" rel="noopener noreferrer" class="${buttonClass}" aria-label="${buttonLabel} for ${escapeHtml(product.name)}">
                  <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.585 1.961.947 2.796.947 3.179 0 5.766-2.587 5.767-5.766.001-3.181-2.585-5.767-5.767-5.767zm3.385 8.169c-.145.407-.732.748-1.02.793-.277.043-.637.075-1.834-.419-1.529-.632-2.508-2.186-2.584-2.288-.077-.102-.619-.824-.619-1.572 0-.748.391-1.116.53-1.268.14-.153.306-.192.408-.192.102 0 .204.001.293.006.094.004.22-.036.344.262.127.306.435 1.061.473 1.139.038.077.064.167.013.269-.051.102-.077.165-.153.255-.077.089-.161.199-.23.267-.077.076-.157.16-.067.314.089.153.397.655.852 1.06 0.585.521 1.077.683 1.231.76.154.077.243.064.333-.039.09-.102.384-.447.486-.6.103-.154.205-.128.346-.077.141.051.895.422 1.049.499.154.077.256.115.295.179.038.064.038.371-.107.778z"/>
                  </svg>
                  <span>${buttonLabel}</span>
                </a>
              </div>
            `;

            grid.appendChild(card);

            if (prodImages.length > 1) {
              bindCarouselHandlers(card, prodImages.length);
            }
          });
        }

        function bindCarouselHandlers(cardEl, totalSlides) {
          const carousel = cardEl.querySelector('.product-carousel');
          if (!carousel) return;
          let current = 0;
          const slides = carousel.querySelectorAll('.carousel-slide');
          const dots = carousel.querySelectorAll('.carousel-dot');
          const btnPrev = carousel.querySelector('.carousel-nav-btn.prev');
          const btnNext = carousel.querySelector('.carousel-nav-btn.next');

          function showSlide(idx) {
            current = (idx + totalSlides) % totalSlides;
            slides.forEach((s, i) => s.classList.toggle('active', i === current));
            dots.forEach((d, i) => d.classList.toggle('active', i === current));
          }

          if (btnPrev) btnPrev.onclick = function(e) { e.preventDefault(); e.stopPropagation(); showSlide(current - 1); };
          if (btnNext) btnNext.onclick = function(e) { e.preventDefault(); e.stopPropagation(); showSlide(current + 1); };
          dots.forEach((d, i) => {
            d.onclick = function(e) { e.preventDefault(); e.stopPropagation(); showSlide(i); };
          });

          let touchStartX = 0;
          carousel.addEventListener('touchstart', function(e) { touchStartX = e.touches[0].clientX; }, { passive: true });
          carousel.addEventListener('touchend', function(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 40) {
              if (diff > 0) showSlide(current - 1);
              else showSlide(current + 1);
            }
          }, { passive: true });
        }

        // Apply initial language & render
        applyLanguage();
      }

      function escapeHtml(text) {
        if (!text) return '';
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      if (window.ContentSmith_DATA) {
        renderStore(window.ContentSmith_DATA);
      } else {
        fetch('products.json')
          .then(res => res.json())
          .then(data => {
            window.ContentSmith_DATA = data;
            renderStore(data);
          })
          .catch(() => {
            if (window.ContentSmith_FIXTURES && window.ContentSmith_FIXTURES.whatsapp) {
              renderStore(window.ContentSmith_FIXTURES.whatsapp.data);
            }
          });
      }
    })();
  </script>
</body>
</html>
